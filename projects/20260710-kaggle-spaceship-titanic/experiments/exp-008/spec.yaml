id: exp-008
title: Official data HistGradientBoosting tuning
status: planned
created: 2026-07-03
benchmark:
  platform: Kaggle
  competition: Spaceship Titanic
  data_dir: ../../data/spaceship-titanic
task:
  type: tabular_binary_classification
  target: Transported
hypothesis: >
  A small hyperparameter search around the exp-006 HistGradientBoosting setup
  can improve local CV and possibly public leaderboard score.
baseline:
  experiment_id: exp-006
  cv_accuracy: 0.8088104680348149
  public_score: 0.80383
method:
  feature_bundle: same as exp-006
  model: HistGradientBoostingClassifier
  search:
    learning_rate: [0.04, 0.05, 0.06]
    max_iter: [200, 300]
    max_leaf_nodes: [15, 31]
    l2_regularization: [0.0, 0.01, 0.05]
metrics:
  primary: 5-fold stratified CV accuracy
success_criteria:
  - All candidates run on identical folds.
  - scores.json records all candidate fold scores.
  - selected model writes a valid submission.csv.
  - Submit only if CV is at least exp-006 CV or if explicitly chosen as diagnostic.
