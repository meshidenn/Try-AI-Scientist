experiment:
  id: exp-034
  title: UltraDomain全量tripletからのBGE-M3 LightRAG vector index作成
  status: completed
objective: >-
  exp-033で確定したUltraDomain全61文書のtripletおよびLightRAG graph/chunkを再利用し、
  Qwen抽出を再実行せずにhome-server GPUでBAAI/bge-m3のdense embeddingとLightRAG vector indexを作成する。
input:
  triplets_jsonl: >-
    data/derived/triplets/UltraDomain--aa8a51d523f8fc3c5a0ab90dd16b7f6b9dbb5d0d/
    Qwen--Qwen3.6-35B-A3B-FP8/triplets.jsonl
  triplets_sha256: 6a5f7eaab019fe8a0c68ed0c89f80c27d5caba8418c11e665a6abd1a11b7d059
  source_lightrag_store: workspace/reproduction-runs/issue-004/runs/run-033/outputs/lightrag-store
  processed_document_count: 61
embedding:
  model: BAAI/bge-m3
  dimension: 1024
  normalization: true
  device: cuda
  batch_size: 32
index:
  type: LightRAG NanoVectorDB
  vectors:
    - chunks
    - entities
    - relationships
constraints:
  - Qwenによるentity/relation抽出を再実行しない
  - source LightRAG storeを変更しない
success_criteria:
  - 全3 vector storeを1,024次元で作成する
  - index manifestに入力triplet hashを記録する
  - source storeとdestination indexの件数が一致する
