experiment:
  id: exp-024
  title: Qwen JSON抽出の重複抑止・件数上限・反復検出の統合検証
  status: failed
objective: >-
  既知のlength終了文書に対して、Qwen JSON抽出で重複禁止プロンプト、
  entity 30件・relation 50件上限、および実装側の反復検出を同時に検証する。
target_document: ultradomain-c58b4831f2d6fec6
input:
  dataset: UltraDomain unique contexts
  selection: single known-failure document
extractor:
  model: Qwen/Qwen3.6-35B-A3B-FP8
  endpoint: http://192.168.100.11:8000/v1
  extraction_format: JSON
  max_tokens: 8192
  entity_limit: 30
  relation_limit: 50
  max_gleaning: 0
validation:
  repetition_detection: line unique ratio below 0.5 with at least 20 nonempty lines
success_criteria:
  - 全chunkがfinish_reason=stopで完了する
  - document statusがprocessedとなる
  - 反復検出が発火しない
