experiment:
  id: exp-002
  title: LightRAGのQwen3.6-35B-A3B-FP8再評価
  status: blocked
  execution_status: 未実行（GPUまたはOpenAI互換endpoint待ち）
  parent_issue: 4

objective: >-
  LightRAGのcorpus、質問、gold evidence、chunking、retrieval設定を固定し、
  LLMだけをQwen/Qwen3.6-35B-A3B-FP8へ変更した再評価を行う。

comparability:
  must_hold_constant:
    - corpus_artifact_and_checksum
    - question_set_and_split
    - gold_evidence_definition
    - document_to_chunk_mapping
    - retrieval_mode_and_candidate_budget
  changed_factor:
    - generation_and_entity_relation_extraction_llm
  interpretation_rule: >-
    本実験はLLM変更を伴う再評価である。元論文または公式実装の完全再現とは主張しない。

lightrag:
  official_repository: https://github.com/HKUDS/LightRAG
  official_evaluation_corpus: TommyChien/UltraDomain
  code_revision: to_be_pinned_before_run
  corpus_revision: to_be_pinned_before_run
  chunk_token_size: to_be_read_from_pinned_configuration
  chunk_overlap_token_size: to_be_read_from_pinned_configuration
  retrieval_mode: to_be_pinned_before_run
  embedding_model: to_be_pinned_before_run

llm:
  model_id: Qwen/Qwen3.6-35B-A3B-FP8
  precision: fp8
  expected_minimum_vram_gb: 42
  supported_server: vLLM>=0.17.0_or_equivalent_openai_compatible_server
  temperature: 0
  max_tokens: to_be_fixed_before_run
  endpoint: to_be_provided_or_started

blockers:
  - Local NVIDIA driver/GPU is unavailable in the current execution environment.
  - No Qwen3.6-35B-A3B-FP8 OpenAI-compatible endpoint has been supplied.
  - LightRAG code and UltraDomain revisions must be pinned before execution.

success_criteria:
  - corpus、question、gold evidence、chunking、retrieval設定とLLM revisionがmanifestで追跡できる
  - Qwen条件のindex構築とqueryを小規模subsetで完走する
  - latency、LLM token/cost、retrieval artifactを保存する
