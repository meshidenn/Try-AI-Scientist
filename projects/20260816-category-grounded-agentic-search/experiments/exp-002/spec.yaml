experiment:
  id: exp-002
  title: LightRAGのQwen3.6-35B-A3B-FP8再評価
  status: completed_with_warnings
  execution_status: 小規模index/query pilot完了（entity extraction truncationを伴う）
  parent_issue: 4

objective: >-
  LightRAGのcorpus、質問、gold evidence、chunking、retrieval設定を固定し、
  LLMだけをQwen/Qwen3.6-35B-A3B-FP8へ変更した再評価を行う。

comparability:
  must_hold_constant:
    - corpus_artifact_and_checksum
    - question_set_and_split
    - gold_evidence_definition
    - document_to_chunk_mapping
    - retrieval_mode_and_candidate_budget
  changed_factor:
    - generation_and_entity_relation_extraction_llm
  interpretation_rule: >-
    本実験はLLM変更を伴う再評価である。元論文または公式実装の完全再現とは主張しない。

lightrag:
  official_repository: https://github.com/HKUDS/LightRAG
  official_evaluation_corpus: TommyChien/UltraDomain
  code_revision: 5183dec553da29e123d45f663045e8efe24cbedf
  corpus_revision: aa8a51d523f8fc3c5a0ab90dd16b7f6b9dbb5d0d
  chunk_token_size: 512
  chunk_overlap_token_size: 64
  retrieval_mode: hybrid
  embedding_model: deterministic-hash-128-v1

llm:
  model_id: Qwen/Qwen3.6-35B-A3B-FP8
  served_model_name: llm
  precision: fp8
  serving_api: http://192.168.100.11:8000/v1
  server_fingerprint: vllm-0.27.0-5fc4282d
  max_model_len: 8192
  supported_server: vLLM>=0.17.0_or_equivalent_openai_compatible_server
  temperature: 0
  max_tokens:
    extract: 512
    keyword: 512
    query: 768
  chat_template_kwargs:
    enable_thinking: false
  endpoint_verification:
    verified_at: 2026-08-25
    models_endpoint: success
    chat_completion: success
    note: デフォルトのthinking出力は比較条件を不安定にするため無効化する

limitations:
  - UltraDomain mixの同一documentに紐づく4問だけを使うsmoke pilotであり、比較性能は評価していない。
  - Qwenのentity extractionは全6 chunkでmax_tokensに達し、relationは0件だった。
  - embedding endpointがないため、固定hash embeddingを使用した。embedding model比較には使えない。

success_criteria:
  - corpus、question、gold evidence、chunking、retrieval設定とLLM revisionがmanifestで追跡できる
  - Qwen endpointを用いるindex構築とqueryを小規模subsetで完走する
  - latency、LLM token/cost、retrieval artifactを保存する
