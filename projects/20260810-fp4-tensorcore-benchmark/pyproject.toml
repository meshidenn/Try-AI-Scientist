[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fp4-tensorcore-benchmark"
version = "0.1.0"
description = "Artifacts and helpers for local FP4 Tensor Core serving benchmarks"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
