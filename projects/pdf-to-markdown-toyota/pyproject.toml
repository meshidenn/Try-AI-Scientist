[project]
name = "pdf-to-markdown-toyota"
version = "0.1.0"
description = "Toyota IR PDF to Markdown fidelity evaluation project."
readme = "workspace/README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.26.3",
]

[project.scripts]
pdf-to-markdown-toyota = "pdf_to_markdown_toyota.interfaces.cli.run_experiment:main"
evaluate-line-aware-ngrams = "pdf_to_markdown_toyota.interfaces.cli.evaluate_line_aware_page_ngrams:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_markdown_toyota"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[dependency-groups]
dev = ["pytest>=8.0"]
