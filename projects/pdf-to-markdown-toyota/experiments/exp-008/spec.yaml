experiment_id: exp-008
title: Three-VLM ensemble evidence confidence for numeric and text candidates
status: completed
objective: >
  Gemma 4、Qwen 3.6、GLM-4.6Vの既存hybrid出力を同一条件のまま再利用し、数値tokenに加えて本文行・見出し・表内非数値セルに根拠付きconfidenceを付与する。
constraints:
  - 追加の推論は行わず、3モデルで共通する既存hybrid出力だけを使う
  - exp-007のp135 chunk出力は、他2モデルと条件が異なるため混在させない
  - text confidenceは意味的正答確率ではなく、文字列根拠に基づくevidence scoreとする
inputs:
  source_manifest: inputs/source-manifest.json
  pilot_pages: inputs/pilot-pages.json
  source_outputs:
    gemma4-26b-moe: ../../exp-003/logs/hybrid-run-v2.json
    qwen3.6-27b: ../../exp-004/logs/qwen3.6-27b-hybrid-pilot.json
    glm-4.6v-flash: ../../exp-004/logs/glm-4.6v-flash-pilot.json
method:
  output_mode: hybrid
  numeric_candidate:
    unit: numeric_token
    weights: {model_agreement: 0.45, pdf_text_evidence: 0.40, table_structure: 0.15}
  text_candidate:
    units: [text_line, table_cell_text]
    matching: normalized_exact_or_sequence_similarity_0.88_or_containment_min_8_chars
    weights: {model_agreement: 0.55, pdf_text_evidence: 0.45}
evaluation:
  - numeric_pdf_coverage
  - numeric_coverage_adjusted_confidence
  - text_pdf_unit_coverage_proxy
  - text_coverage_adjusted_confidence
  - high_medium_low_counts_by_candidate_type
